---
layout: default
---

<div class="home">
  {% if site.posts.size > 0 %}
    <h2>Posts</h2>
    <ul class="post-list">
      {% for post in site.posts %}
        <li>
          <h3>
            <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title }}</a>
          </h3>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No posts yet.</p>
  {% endif %}
</div>
